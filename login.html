<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1c1c1c">
    <meta name="color-scheme" content="dark">
    <title>Iniciar sesión | Computlalte</title>
    <link rel="icon" type="image/svg+xml" href="imagenes/interfaz/favicon.svg">
    <link rel="stylesheet" href="css/fuentes.css">
    <link rel="stylesheet" href="css/style-login.css?v=4">
</head>
<body>
    <!-- Misma barra que el resto de páginas interiores. -->
    <header class="barra-superior">
        <a class="logotipo-superior" href="index.html" aria-label="Computlalte, inicio"><span>COMPU</span><b>TLALTE</b></a>
        <a class="enlace-volver" href="index.html">Volver a la tienda</a>
    </header>

    <div class="contenido-pagina">
        <h1 id="titulo">Iniciar sesión</h1>

        <div id="login">
            <!-- novalidate hace que los mensajes de error los muestre login.js y no el navegador -->
            <form id="formulario" novalidate>
                <label for="correo">Usuario o correo</label>
                <input type="text" id="correo" autocomplete="username" placeholder="admin, gerente, usuario o tu correo" autocapitalize="none" spellcheck="false">

                <label for="clave">Contraseña</label>
                <div class="campo-clave">
                    <input type="password" id="clave" autocomplete="current-password">
                    <button type="button" id="ver-clave">Mostrar</button>
                </div>

                <p id="mensaje" role="alert"></p>

                <button type="submit" id="entrar">Iniciar sesión</button>
            </form>

            <!-- Cambia registro.html por el nombre de tu página de registro -->
            <p id="registro">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
        </div>

        <!-- Accesos de prueba mientras no existe un servidor de cuentas. -->
        <aside class="credenciales-prueba" aria-label="Credenciales de prueba">
            <p class="titulo-credenciales">Accesos de prueba</p>
            <ul>
                <li><span>Administrador</span><code>admin / admin</code></li>
                <li><span>Gerente</span><code>gerente / gerente</code></li>
                <li><span>Cliente</span><code>usuario / usuario</code></li>
            </ul>
            <p class="nota-credenciales">El administrador y el gerente entran al panel de control. El cliente compra como siempre.</p>
        </aside>
    </div>

    <script src="js/tienda-datos.js?v=1"></script>
    <script src="js/scripts-login.js?v=2"></script>
</body>
</html>
